name: Autonomous Daytrading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-day-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install google-genai yfinance pandas ddgs

      - name: Daytrading-Datenbank initialisieren falls nicht vorhanden
        run: |
          python -c "import init_day_db; init_day_db.init_db()" || true

      - name: Daytrading-Bot ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python day_agent.py

      - name: Daytrading-Datenbank in GitHub sichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add day_memory.db
          git diff --staged --quiet || (git commit -m "Auto-update day-trading database" && git push)